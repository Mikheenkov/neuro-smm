name: neuro-smm                       # свой префикс: контейнеры, сеть и тома не пересекаются с другими проектами

services:
  smm:
    build: .
    restart: unless-stopped           # сам поднимается после сбоя и перезагрузки сервера
    env_file: .env                    # секреты только на сервере, права 600
    environment:
      SMM_DATA_DIR: /data
      TZ: Europe/Lisbon
    volumes:
      - ./data:/data                  # база SQLite, медиа — переживают пересборку
    mem_limit: 512m
    cpus: 0.5
    # портов наружу нет: бот сам опрашивает Telegram

  media:                              # отдаёт только data/public (картинки для Threads) через общий Caddy
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./data/public:/srv:ro
      - ./media.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default: {}
      edge:
        aliases: [neuro-smm-media]
    mem_limit: 64m
    cpus: 0.1

  browser:                            # Chromium для VK и Facebook (фаза 2): вход автора через веб-интерфейс по SSH-туннелю
    image: lscr.io/linuxserver/chromium:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
      CUSTOM_USER: nikita
      PASSWORD: ${BROWSER_PASSWORD:?задайте BROWSER_PASSWORD в .env}
      CHROME_CLI: --remote-debugging-port=9222 --lang=ru-RU --no-first-run
      DOCKER_MODS: linuxserver/mods:universal-package-install
      INSTALL_PACKAGES: socat
    volumes:
      - ./browser:/config                                   # профиль Chromium: входы в VK и Facebook
      - ./deploy/browser-services:/custom-services.d:ro     # мост к отладочному порту для контейнера smm
    ports:
      - "127.0.0.1:3001:3001"                               # веб-интерфейс только на сервере, снаружи — через ssh -L
    shm_size: 1gb
    mem_limit: 2g
    cpus: 1.0

networks:
  edge:
    external: true                    # общая сеть сервера, к ней подключён Caddy с доменами
