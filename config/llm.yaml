# LLM-слой (§5). Основной канал — OpenRouter (решение автора 30.10.2026: организация Anthropic ждёт верификации).
# Вернуться на прямой API: providers: [anthropic_api] и имена моделей без префикса (claude-opus-5-5, claude-sonnet-5-5).
# Если будет дорого: поставить первым провайдер claude_cli (подписка), когда он появится.

providers: [openrouter]

models:
  editor: anthropic/claude-sonnet-5.5
  regen: anthropic/claude-sonnet-5.5
  judge: anthropic/claude-sonnet-5.5     # решение автора 30.10.2026: все роли на Sonnet, судья на той же модели, что и редактор

effort:
  editor: medium
  regen: medium
  judge: medium

max_regen_attempts: 2           # перегенераций одной сети после ошибок валидатора
monthly_budget_usd: 55          # мягкий потолок ≈ 50 € в месяц (система считает в долларах)
