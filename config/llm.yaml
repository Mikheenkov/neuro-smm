# LLM-слой (§5). Основной канал — ключ Anthropic API (решение автора 07.10.2026; после верификации организации возвращён с OpenRouter).
# Запасной: providers: [openrouter], модели с префиксом (anthropic/claude-sonnet-5.5), ключ OPENROUTER_API_KEY.
# Если будет дорого: поставить первым провайдер claude_cli (подписка), когда он появится.

providers: [anthropic_api]

models:
  editor: claude-opus-5-5
  regen: claude-opus-5-5
  judge: claude-sonnet-5-5     # судья всегда на другой модели, чем редактор

effort:
  editor: medium
  regen: medium
  judge: medium

max_rounds: 4                   # кругов «переписать → проверить → судья» на сеть; потом публикуем с замечаниями
monthly_budget_usd: 55          # мягкий потолок ≈ 50 € в месяц (система считает в долларах)
