# Публикация по команде автора (решение 10.10.2026): кнопка «Опубликовать» в карточке поста
# или /post <номер>. Автоматической публикации по таймеру нет.

edit_debounce_seconds: 30   # если пост только что правили, ждём, чтобы взять окончательную версию
tick_seconds: 10

publish_order: [threads, max, fb, vk, story_tg, story_vk, story_fb]
max_attempts: 3             # попыток публикации на сеть за одну команду
retry_delays_seconds: [30, 120]
