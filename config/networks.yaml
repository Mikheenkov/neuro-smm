# Включённые сети и лимиты для валидаторов (§3 архитектуры).
# Фаза 1: MAX, Threads, FB. Фаза 2: VK, Stories.

max:
  enabled: true
  audience: ru
  max_len: 4000
  soft_len: 3800
  max_buttons: 2
  button_label_max: 30
  max_images: 12
  max_video_mb: 250

threads:
  enabled: true
  audience: intl
  mode: separate                # separate — 1–3 отдельных поста; chain — ветка ответов
  max_posts: 3
  part_len: 500
  max_parts: 5
  max_urls_per_part: 5
  text_attachment_len: 10000
  topic_tag_max: 50
  max_images: 20
  max_image_mb: 8

fb:
  enabled: true                 # личный профиль, публикация через браузер на сервере
  publish: true                 # включено автором 14.10.2026 (false — режим репетиции)
  audience: intl
  method: browser
  max_len: 6000
  max_hashtags: 2
  link_mode: plain               # plain — адресами; via_threads — без внешних ссылок, строка «Ссылки — в Threads»
  max_images: 10

vk:
  enabled: true                 # личная страница, публикация через браузер на сервере
  publish: true                 # включено автором 14.10.2026 (false — режим репетиции)
  audience: ru
  max_len: 4000
  max_hashtags: 2
  max_images: 10

story:                          # текст карточки сторис: пишет редактор один раз на все площадки ниже
  enabled: false                # сама по себе не публикуется; включаются story_tg / story_vk / story_fb
  audience: ru
  card_title_max: 120

# Сторис по площадкам. Каждая ведёт на этот пост в той же сети, поэтому выходит после него.
story_tg:                       # сторис Telegram-канала, Telethon от аккаунта автора; по тапу — пост в канале
  enabled: true
  publish: true
  sticker: "Ссылка на пост"     # нарисованный стикер, поверх него — кликабельная зона на пост
story_vk:                       # сторис личной страницы VK со стикером-ссылкой на пост в VK
  enabled: true
  publish: false                # репетиция: снимок экрана вместо публикации, пока автор не посмотрит
  after: vk                     # без опубликованного поста в VK сторис не на что вести
  sticker: "Ссылка на пост"     # текст настоящего стикера-ссылки VK
story_fb:                       # сторис профиля Facebook (дальше — в Instagram через Accounts Center); ссылки нет
  enabled: true
  publish: false
  after: fb
  sticker: "Новый пост в профиле"  # плашка без значка ссылки: кликабельной ссылки в Facebook нет

meta_footnote: true             # сноска про Meta в MAX и VK при упоминании Instagram/Facebook
