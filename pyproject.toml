[project]
name = "neuro-smm"
version = "0.1.0"
description = "Агент адаптации и кросспостинга постов из Telegram в MAX, VK, Facebook, Threads"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "aiogram>=3.13",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "playwright>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
